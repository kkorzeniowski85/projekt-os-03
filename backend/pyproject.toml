[project]
name = "fiszki-backend"
version = "0.1.0"
description = "Backend aplikacji do fiszek (FSRS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "fsrs>=6.3,<7",
    "slowapi>=0.1.9",
    # Wysylka plikow do importu (multipart/form-data).
    "python-multipart>=0.0.12",
    # Nowsze eksporty Anki (collection.anki21b) sa skompresowane zstd.
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
