# Buduje aplikacje i publikuje ja na GitHub Pages po kazdej zmianie w master.
#
# Wdrozenie jest jedyna droga aktualizacji na telefonie: service worker
# podmienia wersje sam, bez reinstalacji.
name: Wdrozenie

on:
  push:
    branches: [master]
  # Pozwala wypchnac wdrozenie recznie z zakladki Actions.
  workflow_dispatch:

# Jedno wdrozenie naraz; nowsze zastepuje starsze w kolejce.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Testy przed wdrozeniem - zepsuta wersja nie ma trafiac na telefon.
      - run: npm test

      # Pages serwuje projekt z podkatalogu /<repo>/ - bez tego prefiksu
      # wszystkie odwolania do plikow trafiaja w korzen domeny, czyli w pustke.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
