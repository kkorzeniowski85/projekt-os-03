<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,400italic;7..72,500&display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8fb0d4; text-decoration: none; } a:hover { color: #a8c4e2; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<!-- Ten sam ekran po zmroku. Te same tokeny, przestawione wartosci -
     nie odwrocenie kolorow, tylko wlasny zestaw: cieple czernie zamiast
     czystej, przygaszone kolory ocen (jaskrawe raza po ciemku). -->
<div style="width: 390px; height: 844px; background: #12100e; color: #ebe9e4; display: flex; flex-direction: column;">

  <div style="padding: 16px 20px 0; display: flex; align-items: center; gap: 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7d7a74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <div style="flex-grow: 1; height: 3px; background: #2a2724; border-radius: 2px; overflow: hidden;">
      <div style="width: 35%; height: 100%; background: #8fb0d4; border-radius: 2px;"></div>
    </div>
    <div style="font-size: 13px; color: #7d7a74; font-variant-numeric: tabular-nums;">7 / 20</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 28px; text-align: center; overflow: hidden;">
    <div style="font-size: 11px; letter-spacing: 0.08em; color: #6b6862; text-transform: uppercase; margin-bottom: 20px;">Słownik · nowa</div>

    <div style="font-family: Literata, Georgia, serif; font-size: 26px; line-height: 1.3; color: #9b9891;">to rule out</div>

    <div style="width: 36px; height: 1px; background: #363330; margin: 20px auto;"></div>

    <div style="font-family: Literata, Georgia, serif; font-size: 30px; line-height: 1.28; letter-spacing: -0.01em;">wykluczyć<br>(rozpoznanie)</div>

    <div style="font-family: Literata, Georgia, serif; font-style: italic; font-size: 15px; line-height: 1.55; color: #a19f9a; margin-top: 22px; text-align: left; padding-left: 14px; border-left: 2px solid #363330;">
      We need to rule out a bleed before giving pain relief.
    </div>

    <div style="display: flex; gap: 6px; justify-content: center; margin-top: 22px;">
      <span style="font-size: 11px; color: #9b9891; background: #221f1c; padding: 4px 9px; border-radius: 4px;">oet</span>
      <span style="font-size: 11px; color: #9b9891; background: #221f1c; padding: 4px 9px; border-radius: 4px;">nhs</span>
    </div>
  </div>

  <div style="padding: 0 20px 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
    <div style="border: 1px solid #4a2c35; background: #1e1518; border-radius: 10px; padding: 12px 4px; text-align: center;">
      <div style="font-size: 14px; font-weight: 500; color: #e8879b;">Znowu</div>
      <div style="font-size: 11px; color: #8a6570; margin-top: 3px; font-variant-numeric: tabular-nums;">1 min</div>
    </div>
    <div style="border: 1px solid #4a3a22; background: #1e1a13; border-radius: 10px; padding: 12px 4px; text-align: center;">
      <div style="font-size: 14px; font-weight: 500; color: #e0aa62;">Trudne</div>
      <div style="font-size: 11px; color: #8a7654; margin-top: 3px; font-variant-numeric: tabular-nums;">6 min</div>
    </div>
    <div style="border: 1px solid #234438; background: #131e19; border-radius: 10px; padding: 12px 4px; text-align: center;">
      <div style="font-size: 14px; font-weight: 500; color: #6cc9a0;">Dobre</div>
      <div style="font-size: 11px; color: #5a8874; margin-top: 3px; font-variant-numeric: tabular-nums;">10 min</div>
    </div>
    <div style="border: 1px solid #23394a; background: #131a1e; border-radius: 10px; padding: 12px 4px; text-align: center;">
      <div style="font-size: 14px; font-weight: 500; color: #6fb3dd;">Łatwe</div>
      <div style="font-size: 11px; color: #5a7f96; margin-top: 3px; font-variant-numeric: tabular-nums;">7 dni</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
