# Srodowisko deweloperskie: tylko baza.
#
# Backend i frontend uruchamiaj natywnie (uvicorn / npm run dev) - przeladowanie
# kodu w kontenerze na Windowsie dziala wolno i kapryśnie. Compose pod produkcje
# (backend + Caddy + backupy) dojdzie przy deployu na VPS.

services:
  db:
    image: postgres:17-alpine
    container_name: fiszki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiszki
      POSTGRES_PASSWORD: fiszki
      POSTGRES_DB: fiszki
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiszki -d fiszki"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
